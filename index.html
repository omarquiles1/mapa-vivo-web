<style>
:root{
  --ria:#0E3B43; --hueso:#F3EFE6; --tinta:#14211F; --vivo:#F2C833;
  --tranquilo:#2E9E6B; --animado:#E8892B; --lleno:#D64541;
  /* variantes de texto con contraste AA sobre hueso */
  --t-tranquilo:#1F7A52; --t-animado:#9A520D; --t-lleno:#B5322E;
  --suave:#4A5553; --linea:#D9D2C3; --blanco:#FFFDF8;
  --display:'Archivo',system-ui,sans-serif; --texto:'Atkinson Hyperlegible',system-ui,sans-serif;
  --r:14px; --ancho:1120px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--hueso);color:var(--tinta);font:400 1.0625rem/1.6 var(--texto);overflow-x:hidden}
h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0 0 .5em;letter-spacing:-.01em}
h2{font-size:clamp(1.75rem,5vw,2.75rem);font-weight:800}
h3{font-size:1.25rem;font-weight:700}
p{margin:0 0 1em}
a{color:inherit}
:focus-visible{outline:3px solid var(--vivo);outline-offset:3px;box-shadow:0 0 0 6px var(--tinta)}
.envoltura{max-width:var(--ancho);margin:0 auto;padding:0 16px}
.seccion{padding:72px 0}
.ante{font:700 .875rem/1 var(--texto);letter-spacing:.12em;text-transform:uppercase;color:var(--suave);margin-bottom:12px}
.entradilla{font-size:1.25rem;max-width:40ch}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.icono{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.boton{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:999px;font:700 1rem var(--texto);text-decoration:none;border:2px solid var(--tinta);cursor:pointer;transition:transform .2s}
.boton:hover{transform:translateY(-2px)}
.boton--vivo{background:var(--vivo);border-color:var(--vivo);color:var(--tinta)}
.boton--claro{background:transparent;color:inherit;border-color:currentColor}
.punto{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--vivo);box-shadow:0 0 0 0 rgba(242,200,51,.7);animation:late 1.8s infinite}
@keyframes late{70%{box-shadow:0 0 0 10px rgba(242,200,51,0)}100%{box-shadow:0 0 0 0 rgba(242,200,51,0)}}
/* Niveles: siempre texto + barras, nunca solo color */
.nivel{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.9375rem}
.barras{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.barras i{width:4px;background:currentColor;opacity:.25;border-radius:1px}
.barras i:nth-child(1){height:6px}.barras i:nth-child(2){height:10px}.barras i:nth-child(3){height:14px}
.n1{color:var(--t-tranquilo)}.n2{color:var(--t-animado)}.n3{color:var(--t-lleno)}
.n1 .barras i:nth-child(-n+1),.n2 .barras i:nth-child(-n+2),.n3 .barras i:nth-child(-n+3){opacity:1}
